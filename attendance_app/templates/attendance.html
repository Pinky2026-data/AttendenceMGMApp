{% extends "base.html" %}
{% block content %}
<div class="form-container">
<h2>Your Attendance</h2>
{% if not marked_today %}
<form method="post">
    <button type="submit">Mark Today's Attendance</button>
</form>
{% else %}
<p>You have already marked attendance for today.</p>
{% endif %}
<table>
    <tr><th>Date</th></tr>
    {% for rec in records %}
    <tr>
        <td>{{ rec.date }}</td>
    </tr>
    {% endfor %}
</table>
</div>
{% endblock %}
